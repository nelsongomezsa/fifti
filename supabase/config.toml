project_id = "fifti"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
enable_anonymous_sign_ins = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmación de email obligatoria antes de poder usar la cuenta
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[storage]
enabled = true
file_size_limit = "5MiB"

[local_smtp]
enabled = true
port = 54324

# Proyecto en la nube (producción). Solo ajustes de Auth; la URL real se actualiza tras el despliegue.
[remotes.production]
project_id = "ffrwzpdemfzgeygfxgkj"

[remotes.production.auth]
site_url = "https://fifti-seven.vercel.app"
additional_redirect_urls = ["https://fifti-seven.vercel.app/auth/callback"]
enable_anonymous_sign_ins = true
minimum_password_length = 12
enable_refresh_token_rotation = true

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# SMTP propio (Brevo). Los valores sensibles llegan por variables de entorno al ejecutar `supabase config push`;
# aquí solo hay referencias, nunca secretos ni correos personales.
[remotes.production.auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "Fifti"

[remotes.production.auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
